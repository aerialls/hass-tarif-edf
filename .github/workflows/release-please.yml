name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The default GITHUB_TOKEN never triggers other workflows, so the
          # release PR it opens would never get its required status checks
          # (Pytest/Hassfest/HACS) to run, and merging would stay blocked
          # forever. RELEASE_PAT just needs Contents + Pull requests write.
          token: ${{ secrets.RELEASE_PAT }}
