name: Publish release

on:
  push:
    branches: [main]
    paths:
      - custom_components/tarif_edf/manifest.json

jobs:
  publish:
    name: Tag and publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read manifest version
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/tarif_edf/manifest.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: check
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release commit
        if: steps.check.outputs.already_released == 'false'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_VERSION}"

      - name: Create GitHub Release
        if: steps.check.outputs.already_released == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
