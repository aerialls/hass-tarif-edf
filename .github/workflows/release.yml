name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 3.2.0)"
        required: true
        type: string

jobs:
  release:
    name: Bump version and release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validate version format
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_VERSION' is not a valid semver (e.g. 3.2.0 or 3.2.0-beta.1)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # main is protected and requires status checks; pushing the version
          # bump commit straight to main needs an admin-owned PAT so the push
          # is exempted the same way an admin's own push would be.
          token: ${{ secrets.RELEASE_PAT }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Bump manifest.json version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          yq -i -o json '.version=strenv(RELEASE_VERSION)' \
            custom_components/tarif_edf/manifest.json

      - name: Bump pyproject.toml version
        run: uv version --frozen "${{ inputs.version }}"

      - name: Commit and tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/tarif_edf/manifest.json pyproject.toml
          git commit -m "chore: release ${RELEASE_VERSION}"
          git tag "${RELEASE_VERSION}"
          git push origin HEAD:main
          git push origin "refs/tags/${RELEASE_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true
