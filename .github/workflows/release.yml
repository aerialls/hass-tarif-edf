name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 3.2.0)"
        required: true
        type: string

jobs:
  release:
    name: Bump version and release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validate version format
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_VERSION' is not a valid semver (e.g. 3.2.0 or 3.2.0-beta.1)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Bump manifest.json version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          yq -i -o json '.version=strenv(RELEASE_VERSION)' \
            custom_components/tarif_edf/manifest.json

      - name: Commit and tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/tarif_edf/manifest.json
          git commit -m "chore: release ${RELEASE_VERSION}"
          git tag "${RELEASE_VERSION}"
          git push origin HEAD:main
          git push origin "refs/tags/${RELEASE_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true
