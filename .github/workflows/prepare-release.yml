name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 3.2.0)"
        required: true
        type: string

jobs:
  prepare:
    name: Open version-bump PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate version format
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_VERSION' is not a valid semver (e.g. 3.2.0 or 3.2.0-beta.1)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # A branch pushed (and PR opened) with the default GITHUB_TOKEN
          # never triggers other workflows, so its required status checks
          # would never run. RELEASE_PAT just needs to be a regular
          # collaborator token with Contents + Pull requests write access -
          # no admin/bypass rights needed, since this only opens a PR for
          # you to review and merge yourself.
          token: ${{ secrets.RELEASE_PAT }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Bump manifest.json version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          yq -i -o json '.version=strenv(RELEASE_VERSION)' \
            custom_components/tarif_edf/manifest.json

      - name: Bump pyproject.toml version
        run: uv version --frozen "${{ inputs.version }}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/${RELEASE_VERSION}"
          git add custom_components/tarif_edf/manifest.json pyproject.toml
          git commit -m "chore: release ${RELEASE_VERSION}"
          git push origin "release/${RELEASE_VERSION}"
          gh pr create \
            --base main \
            --head "release/${RELEASE_VERSION}" \
            --title "chore: release ${RELEASE_VERSION}" \
            --body "Automated version bump for release ${RELEASE_VERSION}. Merging this (squash) will tag and publish the release."
